name: Build and Push to GHCR

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Mahjong/**'
      - 'Mahjong.Tests/**'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jayhtang/mahjong

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build tests
        run: dotnet build Mahjong.Tests/Mahjong.Tests.csproj

      - name: Install Playwright browsers
        run: pwsh Mahjong.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run unit and E2E tests
        run: dotnet test Mahjong.Tests/Mahjong.Tests.csproj --no-build --verbosity normal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Extract Git Variables
        id: git_vars
        run: |
          echo "GIT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT_COUNT=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT_DATE=$(git show -s --format=%ci HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Mahjong/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_HASH=${{ steps.git_vars.outputs.GIT_COMMIT_HASH }}
            GIT_COMMIT_COUNT=${{ steps.git_vars.outputs.GIT_COMMIT_COUNT }}
            GIT_COMMIT_DATE=${{ steps.git_vars.outputs.GIT_COMMIT_DATE }}

      - name: Trigger Portainer Webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
